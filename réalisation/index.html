<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Cadeaux Filles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>🎀 Boutique Cadeaux Pour Filles 🎀</h1>
        <p>Trouve le cadeau parfait !</p>
    </header>

    <div class="search-filter">
        <input type="text" id="searchInput" placeholder="Rechercher un produit...">
        <select id="categoryFilter">
            <option value="all">Toutes les catégories</option>
            <option value="bijoux">Bijoux</option>
            <option value="accessoires">Accessoires</option>
            <option value="carnets">Carnet moderne</option>
            <option value="tasses">Tasses modernes</option>
        </select>
    </div>
    
    <div class="product-grid" id="productGrid">
        <!-- Les produits seront insérés ici par JavaScript -->
    </div>

    <script src="script.js"></script>

    <footer>
        <p>© 2024 Boutique Cadeaux Pour Filles. Tous droits réservés.</p>
    </footer>
</body>
</html>
